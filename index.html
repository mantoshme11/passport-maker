<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Photo & Signature Resizer - @mantoshlive Edition</title>
    <link rel="stylesheet" href="cropper.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 480px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #eaeaea; }
        
        .brand-header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .logo-icon { width: 50px; height: 50px; background: #d32f2f; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-text-box { text-align: left; }
        .logo-main-text { font-size: 22px; font-weight: bold; color: #d32f2f; line-height: 1.1; margin-bottom: 2px; }
        .logo-sub-text { font-size: 14px; color: #388e3c; font-weight: bold; }
        .creator-name { font-size: 10px; color: #777; margin-top: 3px; font-weight: normal; text-transform: uppercase; }

        .step { display: none; }
        .step.active { display: block; }
        
        .preview-container { max-width: 100%; margin: 15px 0; background: #f0f0f0; border-radius: 8px; border: 1px solid #ccc; overflow: hidden; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; }
        
        .controls { text-align: left; background: #fdfdfd; padding: 20px; border-radius: 10px; border: 1px solid #eee; margin: 15px 0; }
        label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-top: 12px; }
        input[type="range"], input[type="text"], input[type="color"], select { width: 100%; margin-top: 6px; box-sizing: border-box; }
        input[type="text"], select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        
        button { background: #d32f2f; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 17px; width: 100%; margin-top: 12px; font-weight: bold; }
        button:hover { background: #b71c1c; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 12px; }
        .btn-back { background: #70757a !important; width: 35% !important; }
        .btn-back:hover { background: #5f6368 !important; }
        .btn-next { width: 65% !important; margin-top: 0 !important; }

        .format-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .format-btns button { background: #388e3c; font-size: 15px; padding: 12px 5px; }
        
        .kb-box { background: #fff8e1; padding: 15px; border-radius: 8px; border: 1px solid #ffe082; margin-bottom: 15px; }
        .kb-text { font-size: 26px; color: #d32f2f; font-weight: bold; }
        
        .footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid #eaeaea; font-size: 14px; color: #555; }
        .insta-link { display: inline-flex; align-items: center; text-decoration: none; color: #e1306c; font-weight: bold; margin-top: 10px; }
        .insta-link img { width: 20px; margin-right: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="logo-icon">M</div>
        <div class="logo-text-box">
            <div class="logo-main-text">PHOTO & SIGN MAKER</div>
            <div class="logo-sub-text">All-in-One Online Resizer</div>
            <div class="creator-name">by Mantosh Kumar</div>
        </div>
    </div>

    <!-- Step 1 -->
    <div id="step1" class="step active">
        <div class="controls" style="margin-top:0;">
            <label>क्या बनाना चाहते हैं? (Select Mode):</label>
            <select id="docType" onchange="updateModeUI()">
                <option value="ration">Ration Card Family Photo (40x30mm)</option>
                <option value="passport">Passport Photo (3.5x4.5cm)</option>
                <option value="signature">Signature Resize (276x118 px / Max 20KB)</option>
            </select>
        </div>

        <div style="padding: 50px 15px; border: 2px dashed #d32f2f; border-radius: 12px; background: #fff8f8; cursor: pointer;" onclick="document.getElementById('uploadInput').click()">
            <p style="font-size: 16px; color: #d32f2f; font-weight: bold;">Photo / Signature Select Karein</p>
            <input type="file" id="uploadInput" accept="image/*" style="display:none">
        </div>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="step">
        <h3>Step 2: Crop Image</h3>
        <div class="preview-container"><img id="cropImage" style="max-width:100%"></div>
        <div class="btn-group">
            <button class="btn-back" onclick="showStep(1)">⬅ Back</button>
            <button class="btn-next" onclick="applyCrop()">Save & Next</button>
        </div>
    </div>

    <!-- Step 3 -->
    <div id="step3" class="step">
        <h3>Step 3: Edit Details</h3>
        <canvas id="borderCanvas"></canvas>
        <div class="controls">
            <label>Brightness (चमक):</label>
            <input type="range" id="brightness" min="50" max="150" value="100" oninput="drawFinal()">
            
            <label>Border Thickness & Color (बॉर्डर):</label>
            <div style="display: flex; gap: 10px;">
                <input type="range" id="borderWidth" min="0" max="15" value="2" oninput="drawFinal()">
                <input type="color" id="borderColor" value="#ffffff" onchange="drawFinal()" style="width: 70px; height: 40px; border:none; padding:0;">
            </div>
            
            <div id="passportFields" style="display:none;">
                <label>Student Name (Optional):</label>
                <input type="text" id="userName" placeholder="MANTOSH KUMAR" oninput="drawFinal()">
                
                <label>Date of Photo (Optional):</label>
                <input type="text" id="userDate" placeholder="17/04/2026" oninput="drawFinal()">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="showStep(2)">⬅ Back</button>
            <button class="btn-next" onclick="goToExport()">Save & Next</button>
        </div>
    </div>

    <!-- Step 4 -->
    <div id="step4" class="step">
        <h3>Step 4: Final Save</h3>
        <div class="kb-box">
            <span class="kb-text" id="kbValue">--</span> <span style="font-weight: bold;">KB</span>
        </div>
        <label>Adjust Quality (KB Size Control):</label>
        <input type="range" id="qualityRange" min="5" max="100" value="80" oninput="updateSizeDisplay()">
        
        <div class="format-btns">
            <button onclick="download('image/jpeg', 'jpg')">JPG</button>
            <button onclick="download('image/jpeg', 'jpeg')">JPEG</button>
            <button onclick="download('image/png', 'png')">PNG</button>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="showStep(3)">⬅ Back</button>
            <button class="btn-next" onclick="location.reload()" style="background: #70757a;">Start New</button>
        </div>
    </div>

    <div class="footer">
        Developed with ❤️ by <b>Mantosh Kumar</b><br>
        <a href="https://instagram.com/mantoshlive" target="_blank" class="insta-link">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="ig"> 
            @mantoshlive
        </a>
    </div>
</div>

<script src="cropper.min.js"></script>
<script>
    let cropper;
    const uploadInput = document.getElementById('uploadInput');
    const cropImage = document.getElementById('cropImage');
    const borderCanvas = document.getElementById('borderCanvas');
    const ctx = borderCanvas.getContext('2d');

    function updateModeUI() {
        const docType = document.getElementById('docType').value;
        const passportFields = document.getElementById('passportFields');
        passportFields.style.display = (docType === 'passport') ? 'block' : 'none';
    }

    function showStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }

    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        const docType = document.getElementById('docType').value;
        
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                cropImage.src = event.target.result;
                showStep(2);
                if (cropper) cropper.destroy();
                
                let cropRatio = 4 / 3;
                if (docType === 'passport') cropRatio = 3.5 / 4.5;
                if (docType === 'signature') cropRatio = 276 / 118;

                setTimeout(() => {
                    cropper = new Cropper(cropImage, { aspectRatio: cropRatio, viewMode: 1 });
                }, 200);
            };
            reader.readAsDataURL(file);
        }
    });

    function applyCrop() {
        const docType = document.getElementById('docType').value;
        let outWidth = 400, outHeight = 300;

        if (docType === 'passport') { outWidth = 350; outHeight = 450; }
        else if (docType === 'signature') { outWidth = 276; outHeight = 118; }

        window.croppedImgData = cropper.getCroppedCanvas({ width: outWidth, height: outHeight });
        drawFinal();
        showStep(3);
    }

    function drawFinal() {
        const docType = document.getElementById('docType').value;
        const bVal = document.getElementById('brightness').value;
        const bWidth = parseInt(document.getElementById('borderWidth').value);
        const bColor = document.getElementById('borderColor').value;
        const uName = document.getElementById('userName').value.toUpperCase();
        const uDate = document.getElementById('userDate').value;

        let w = 400, h = 300;
        if (docType === 'passport') { w = 350; h = 450; }
        if (docType === 'signature') { w = 276; h = 118; }

        borderCanvas.width = w; 
        borderCanvas.height = h;
        
        ctx.filter = `brightness(${bVal}%)`;
        ctx.drawImage(window.croppedImgData, 0, 0, w, h);
        ctx.filter = "none";

        if (bWidth > 0) {
            ctx.strokeStyle = bColor;
            ctx.lineWidth = bWidth * 2;
            ctx.strokeRect(0, 0, w, h);
        }

        if (docType === 'passport' && (uName || uDate)) {
            ctx.fillStyle = "white";
            ctx.fillRect(bWidth, 380, 350 - (bWidth*2), 65);
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.font = "bold 18px Arial";
            ctx.fillText(uName, 175, 405);
            ctx.font = "15px Arial";
            ctx.fillText(uDate, 175, 430);
        }
    }

    function updateSizeDisplay() {
        const q = document.getElementById('qualityRange').value / 100;
        const dataUrl = borderCanvas.toDataURL('image/jpeg', q);
        const sizeInKB = (dataUrl.split(',')[1].length * (3/4) / 1024).toFixed(2);
        document.getElementById('kbValue').innerText = sizeInKB;
    }

    function goToExport() { 
        const docType = document.getElementById('docType').value;
        if (docType === 'signature') {
            document.getElementById('qualityRange').value = 70;
        }
        showStep(4); 
        updateSizeDisplay(); 
    }

    function download(mime, ext) {
        const q = document.getElementById('qualityRange').value / 100;
        const docType = document.getElementById('docType').value;
        const link = document.createElement('a');
        link.download = `${docType}_by_Mantosh_${Date.now()}.${ext}`;
        link.href = borderCanvas.toDataURL(mime, (ext === 'png' ? 1.0 : q));
        link.click();
    }
</script>
</body>
</html>
